name: Refresh visit data

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Parses the PM India registry (via Jina mirror) into data/visits.json and
      # collects third-party trip coverage into data/news.json. Uses stdlib only.
      # On a fetch/parse failure the script exits 0 without writing, so a bad day
      # leaves the last good data in place instead of blanking the site.
      - name: Refresh visits + news
        run: python3 scripts/refresh.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/visits.json data/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh visit data + news [$(date -u +%Y-%m-%d)]"
            git push
          fi
